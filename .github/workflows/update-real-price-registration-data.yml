name: Update Real Price Registration Data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 3'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate real price registration data
        run: npm run data:real-price-registration

      - name: Commit updated data
        run: |
          if git diff --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/real-price-registration
          git commit -m "chore(data): update real price registration"
          git push
